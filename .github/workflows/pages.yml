# Refresh data.json every 3 hours and publish the web page
name: Deploy web page

on:
  schedule:
    - cron: "17 */3 * * *"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch forecast
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python3 web/snapshot.py
      # Only these two files are published, so the script and anything else in web/ stay out of the site.
      - name: Collect site
        run: |
          mkdir _site
          cp web/data.json _site/
          # index.html has no document skeleton of its own, so GitHub Pages needs one added here.
          {
            printf '<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">'
            printf '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
            printf '<style>body{margin:0;font-size:14px}img{max-width:100%%}[hidden]{display:none!important}</style>\n'
            cat web/index.html
          } > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
