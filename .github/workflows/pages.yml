# Refresh data.json about every 3 hours and publish the web page.
# GitHub drops many scheduled runs under load (only 1 of 5 fired on 2026-11-02), so the
# schedule fires hourly and a run skips when the live data is still under 150 minutes old.
# That keeps CWA requests near one fetch per 3 hours while a dropped run costs at most an hour.
name: Deploy web page

on:
  schedule:
    - cron: "41 * * * *"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check data age
        id: age
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json, urllib.request
          try:
              with urllib.request.urlopen("https://jjlai63-png.github.io/cwa-weather/data.json", timeout=30) as r:
                  generated = datetime.datetime.fromisoformat(json.load(r)["generated"])
              age = datetime.datetime.now(datetime.timezone.utc) - generated
              print("skip=" + ("true" if age < datetime.timedelta(minutes=150) else "false"))
          except Exception:
              print("skip=false")  # cannot tell, so refresh
          PY
          cat "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.age.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.age.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Fetch forecast
        if: steps.age.outputs.skip != 'true'
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python3 web/snapshot.py
      # Only these two files are published, so the script and anything else in web/ stay out of the site.
      - name: Collect site
        if: steps.age.outputs.skip != 'true'
        run: |
          mkdir _site
          cp web/data.json _site/
          # index.html has no document skeleton of its own, so GitHub Pages needs one added here.
          {
            printf '<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">'
            printf '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
            printf '<style>body{margin:0;font-size:14px}img{max-width:100%%}[hidden]{display:none!important}</style>\n'
            cat web/index.html
          } > _site/index.html
      - uses: actions/configure-pages@v5
        if: steps.age.outputs.skip != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.age.outputs.skip != 'true'
        with:
          path: _site
      - id: deployment
        if: steps.age.outputs.skip != 'true'
        uses: actions/deploy-pages@v4
